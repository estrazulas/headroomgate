<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Headroom Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: {} } }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md p-8">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 border border-gray-200 dark:border-gray-700">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold tracking-tight">
                    Headroom <span class="text-indigo-500">Admin</span>
                </h1>
                <p class="text-gray-500 dark:text-gray-400 mt-2">Sign in with your API key</p>
            </div>

            {% if error %}
            <div class="mb-6 p-4 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-lg text-red-700 dark:text-red-400 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form action="/manage/login" method="post" class="space-y-5">
                <div>
                    <label for="api_key" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                        API Key
                    </label>
                    <input
                        type="password"
                        name="api_key"
                        id="api_key"
                        placeholder="hr_..."
                        required
                        autofocus
                        class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                    />
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1.5">
                        Use an <code class="text-indigo-500">hr_*</code> API key from an admin or team_lead account.
                    </p>
                </div>
                <button
                    type="submit"
                    class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800"
                >
                    Sign In
                </button>
            </form>
        </div>
    </div>
</body>
</html>
